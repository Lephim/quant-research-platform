[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-platform"
version = "0.1.0"
description = "Portfolio estimation and walk-forward research with explicit trading assumptions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.2", "scipy>=1.12", "scikit-learn>=1.4", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8"]
notebooks = ["jupyterlab>=4", "ipykernel>=6", "matplotlib>=3.8", "plotly>=5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["analytics*", "backtesting*", "data*", "visualization*", "research*", "agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
